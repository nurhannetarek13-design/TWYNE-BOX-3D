import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe7e4dd);

const camera=new THREE.PerspectiveCamera(27,innerWidth/innerHeight,.01,100);
camera.position.set(0,.034,.235);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
document.getElementById('app').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,.032,0);
controls.autoRotate=false;
controls.minDistance=.12;
controls.maxDistance=.42;

scene.add(new THREE.HemisphereLight(0xffffff,0x6c665d,2.25));
const key=new THREE.DirectionalLight(0xffffff,4.5);
key.position.set(2,3,4);key.castShadow=true;scene.add(key);
const rim=new THREE.DirectionalLight(0xfff7ec,2);
rim.position.set(-3,1,-2);scene.add(rim);

const sample=new THREE.Group();scene.add(sample);
const bodyR=.0055,bodyH=.048,bodyY=.024;

const glass=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.04,transmission:.97,transparent:true,opacity:.48,thickness:.0018,ior:1.5,clearcoat:1});
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(bodyR*.79,bodyR*.79,bodyH*.69,64),new THREE.MeshPhysicalMaterial({color:0xf3d6a2,transparent:true,opacity:.3,roughness:.08,transmission:.42,thickness:.004,ior:1.36}));
liquid.position.y=bodyY-bodyH*.115;sample.add(liquid);

const body=new THREE.Mesh(new THREE.CylinderGeometry(bodyR,bodyR,bodyH,96),glass);
body.position.y=bodyY;body.castShadow=true;sample.add(body);

const base=new THREE.Mesh(new THREE.CylinderGeometry(bodyR*.98,bodyR*.98,.0021,96),glass);
base.position.y=.0013;sample.add(base);

const neck=new THREE.Mesh(new THREE.CylinderGeometry(.00325,.00345,.0068,64),glass);
neck.position.y=.0513;sample.add(neck);

const collar=new THREE.Mesh(new THREE.CylinderGeometry(.00415,.00415,.0032,64),new THREE.MeshStandardMaterial({color:0x111111,roughness:.42,metalness:.18}));
collar.position.y=.0551;sample.add(collar);

const cap=new THREE.Mesh(new THREE.CylinderGeometry(.00455,.00455,.0115,64),new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.62}));
cap.position.y=.06245;sample.add(cap);

const top=new THREE.Mesh(new THREE.CylinderGeometry(.00458,.00458,.00035,64),new THREE.MeshStandardMaterial({color:0x080808,roughness:.34}));
top.position.y=.06835;sample.add(top);

const labelY=.027,labelH=.028;
const sleeve=new THREE.Mesh(
  new THREE.CylinderGeometry(bodyR+.00011,bodyR+.00011,labelH,96,1,true),
  new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.10,roughness:.16,transmission:.80,thickness:.00012,ior:1.43,clearcoat:.3,depthWrite:false,side:THREE.DoubleSide})
);
sleeve.position.y=labelY;sample.add(sleeve);

function makeCanvas(w=1800,h=760){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function tex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}
function addPlane(t,w,h,y,z,ry,rz){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false}));
  m.position.set(0,y,z);m.rotation.y=ry;m.rotation.z=rz;m.renderOrder=5;sample.add(m)
}

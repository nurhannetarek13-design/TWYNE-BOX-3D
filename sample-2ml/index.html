<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TWYNE — 2ml Sample Landscape V4</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7e4dd;font-family:Arial,Helvetica,sans-serif}
    #app{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    .ui{position:fixed;left:24px;top:22px;z-index:3;color:#121212;pointer-events:none}
    .brand{font-size:12px;font-weight:700;letter-spacing:.22em}
    .sub{margin-top:8px;font-size:10px;letter-spacing:.16em;opacity:.56}
    .hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:9px;letter-spacing:.16em;color:#121212;opacity:.42;pointer-events:none;white-space:nowrap}
  </style>
</head>
<body>
<div id="app"></div>
<div class="ui"><div class="brand">TWYNE</div><div class="sub">2ML SAMPLE / SINGLE-LINE LANDSCAPE LABEL</div></div>
<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe7e4dd);

const camera = new THREE.PerspectiveCamera(27, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0.033, 0.235);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.target.set(0, 0.032, 0);
controls.minDistance = .12;
controls.maxDistance = .42;
controls.autoRotate = false;

scene.add(new THREE.HemisphereLight(0xffffff, 0x6c665d, 2.25));
const key = new THREE.DirectionalLight(0xffffff, 4.5);
key.position.set(2,3,4); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0xfff7ec, 2.0);
rim.position.set(-3,1,-2); scene.add(rim);

const sample = new THREE.Group();
scene.add(sample);

const bodyR = 0.0055;
const bodyH = 0.048;
const bodyY = 0.024;

const liquidMat = new THREE.MeshPhysicalMaterial({
  color:0xf3d6a2, transparent:true, opacity:.30, roughness:.08, metalness:0,
  transmission:.42, thickness:.004, ior:1.36
});
const liquid = new THREE.Mesh(new THREE.CylinderGeometry(bodyR*.79, bodyR*.79, bodyH*.69, 64), liquidMat);
liquid.position.y = bodyY - bodyH*.115;
sample.add(liquid);

const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xffffff, roughness:.04, metalness:0, transmission:.97, transparent:true,
  opacity:.48, thickness:.0018, ior:1.50, envMapIntensity:1.15, clearcoat:1, clearcoatRoughness:.03
});
const body = new THREE.Mesh(new THREE.CylinderGeometry(bodyR, bodyR, bodyH, 96), glassMat);
body.position.y = bodyY; body.castShadow = true; body.receiveShadow = true; sample.add(body);

const base = new THREE.Mesh(new THREE.CylinderGeometry(bodyR*.98, bodyR*.98, .0021, 96), new THREE.MeshPhysicalMaterial({
  color:0xffffff, roughness:.03, transmission:.92, transparent:true, opacity:.56, thickness:.003, ior:1.5
}));
base.position.y = .0013; sample.add(base);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(.00325,.00345,.0068,64), glassMat);
neck.position.y = .0513; sample.add(neck);

const black = new THREE.MeshStandardMaterial({color:0x111111,roughness:.42,metalness:.18});
const collar = new THREE.Mesh(new THREE.CylinderGeometry(.00415,.00415,.0032,64),black);
collar.position.y=.0551; sample.add(collar);

const capMat = new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.62,metalness:.03});
const cap = new THREE.Mesh(new THREE.CylinderGeometry(.00455,.00455,.0115,64),capMat);
cap.position.y=.06245; cap.castShadow=true; sample.add(cap);

const topDisc = new THREE.Mesh(new THREE.CylinderGeometry(.00458,.00458,.00035,64),new THREE.MeshStandardMaterial({color:0x080808,roughness:.34}));
topDisc.position.y=.06835; sample.add(topDisc);

// TRUE LANDSCAPE CLEAR LABEL: very shallow band
const labelY = 0.027;
const labelH = 0.0052;
const clearLabelMat = new THREE.MeshPhysicalMaterial({
  color:0xffffff, transparent:true, opacity:.12, roughness:.16, metalness:0,
  transmission:.76, thickness:.00012, ior:1.43, clearcoat:.35, clearcoatRoughness:.2,
  depthWrite:false, side:THREE.DoubleSide
});
const labelSleeve = new THREE.Mesh(new THREE.CylinderGeometry(bodyR+.00011,bodyR+.00011,labelH,96,1,true),clearLabelMat);
labelSleeve.position.y=labelY; labelSleeve.renderOrder=2; sample.add(labelSleeve);

function canvasTexture(draw, w=2600, h=520){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.clearRect(0,0,w,h); draw(x,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}

function addTextPlane(texture,w,h,y,z,rotY=0){
  const mat=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  m.position.set(0,y,z); m.rotation.y=rotY; m.renderOrder=5; sample.add(m); return m;
}

// FRONT — ONE SINGLE HORIZONTAL LINE
const frontTex = canvasTexture((ctx,w,h)=>{
  ctx.textBaseline='middle';
  ctx.fillStyle='#111111';

  ctx.textAlign='left';
  ctx.font='700 78px Arial, Helvetica, sans-serif';
  ctx.fillText('TWYNE', 90, h*.50);

  ctx.textAlign='center';
  ctx.font='700 118px Arial, Helvetica, sans-serif';
  ctx.fillText('SOTTO VOCE', w*.54, h*.50);

  ctx.textAlign='right';
  ctx.font='500 56px Arial, Helvetica, sans-serif';
  ctx.fillText('EAU DE PARFUM', w-90, h*.50);
});
addTextPlane(frontTex,.0109,.0028,labelY,bodyR+.00024,0);

// BACK — ONE SINGLE HORIZONTAL LINE
const backTex = canvasTexture((ctx,w,h)=>{
  ctx.textBaseline='middle';
  ctx.fillStyle='#111111';
  ctx.textAlign='left';
  ctx.font='700 78px Arial, Helvetica, sans-serif';
  ctx.fillText('TWYNE', 110, h*.50);
  ctx.textAlign='right';
  ctx.font='500 62px Arial, Helvetica, sans-serif';
  ctx.fillText('TWYNEHAUS.COM', w-110, h*.50);
});
const backMat = new THREE.MeshBasicMaterial({map:backTex,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});
const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(.0109,.0028),backMat);
backPlane.position.set(0,labelY,-bodyR-.00024);
backPlane.rotation.y=Math.PI;
backPlane.renderOrder=5;
sample.add(backPlane);

const floorMat=new THREE.ShadowMaterial({color:0x000000,opacity:.13});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(.5,.5),floorMat);
floor.rotation.x=-Math.PI/2; floor.position.y=-.0001; floor.receiveShadow=true; scene.add(floor);

const studioMat=new THREE.MeshStandardMaterial({color:0xe7e4dd,roughness:1,side:THREE.DoubleSide});
const backdrop=new THREE.Mesh(new THREE.PlaneGeometry(.9,.9),studioMat);
backdrop.position.set(0,.18,-.24); scene.add(backdrop);

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
animate();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TWYNE — 2ml Sample V19</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7e4dd;font-family:Arial,Helvetica,sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font-size:9px;letter-spacing:.16em;color:#111;opacity:.35;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe7e4dd);

const camera=new THREE.PerspectiveCamera(26,innerWidth/innerHeight,.01,100);
camera.position.set(0,.034,.155);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.target.set(0,.034,0);
controls.minDistance=.105;
controls.maxDistance=.26;
controls.autoRotate=false;

scene.add(new THREE.HemisphereLight(0xffffff,0x746d64,2.35));
const key=new THREE.DirectionalLight(0xffffff,4.4);key.position.set(2.2,3.2,4);key.castShadow=true;scene.add(key);
const rim=new THREE.DirectionalLight(0xfff7ed,1.8);rim.position.set(-3,1,-2);scene.add(rim);

const sample=new THREE.Group();scene.add(sample);

const r=.0057;
const bodyH=.052;
const bodyY=.026;

const liquidMat=new THREE.MeshPhysicalMaterial({color:0xead9bc,transparent:true,opacity:.34,roughness:.07,transmission:.42,thickness:.004,ior:1.35});
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(r*.79,r*.79,bodyH*.73,72),liquidMat);
liquid.position.y=.0222;sample.add(liquid);

const glassMat=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.025,transmission:.98,transparent:true,opacity:.5,thickness:.0018,ior:1.5,clearcoat:1,clearcoatRoughness:.02});
const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,bodyH,96),glassMat);
body.position.y=bodyY;body.castShadow=true;body.receiveShadow=true;sample.add(body);

const base=new THREE.Mesh(new THREE.CylinderGeometry(r*.985,r*.985,.0021,96),glassMat);
base.position.y=.0012;sample.add(base);

const neck=new THREE.Mesh(new THREE.CylinderGeometry(.00325,.00345,.0066,72),glassMat);
neck.position.y=.0552;sample.add(neck);

const collar=new THREE.Mesh(new THREE.CylinderGeometry(.00425,.00425,.0032,72),new THREE.MeshStandardMaterial({color:0x101010,roughness:.35,metalness:.2}));
collar.position.y=.0588;sample.add(collar);

const cap=new THREE.Mesh(new THREE.CylinderGeometry(.0048,.0048,.0128,72),new THREE.MeshStandardMaterial({color:0x080808,roughness:.48,metalness:.04}));
cap.position.y=.0668;cap.castShadow=true;sample.add(cap);

const capTop=new THREE.Mesh(new THREE.CylinderGeometry(.00482,.00482,.00035,72),new THREE.MeshStandardMaterial({color:0x050505,roughness:.3}));
capTop.position.y=.07335;sample.add(capTop);

const labelY=.030;
const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(r+.00012,r+.00012,.030,96,1,true),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.075,roughness:.15,transmission:.9,thickness:.00008,ior:1.43,depthWrite:false,side:THREE.DoubleSide}));
sleeve.position.y=labelY;sample.add(sleeve);

function makeTextTexture(text,fontPx,weight=700,tracking=0){
 const c=document.createElement('canvas');c.width=1600;c.height=300;
 const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';x.font=`${weight} ${fontPx}px Arial, Helvetica, sans-serif`;
 if(!tracking){x.fillText(text,800,150)}else{
   const chars=[...text];const widths=chars.map(ch=>x.measureText(ch).width);const total=widths.reduce((a,b)=>a+b,0)+tracking*(chars.length-1);let pos=(1600-total)/2;
   x.textAlign='left';chars.forEach((ch,i)=>{x.fillText(ch,pos,150);pos+=widths[i]+tracking});
 }
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}

function addFrontPlane(texture,w,h,y,zOffset=.00035){
 const mat=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
 m.position.set(0,y,r+zOffset);m.renderOrder=20;sample.add(m);return m;
}

function addBackPlane(texture,w,h,y,zOffset=.00035){
 const mat=new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
 m.position.set(0,y,-r-zOffset);m.rotation.y=Math.PI;m.renderOrder=20;sample.add(m);return m;
}

// FRONT — ALL HORIZONTAL
const loader=new THREE.TextureLoader();
loader.load('./twyne-logo.png?v=19',(logoTex)=>{
 logoTex.colorSpace=THREE.SRGBColorSpace;
 logoTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
 addFrontPlane(logoTex,.0092,.00195,.0386);
 addBackPlane(logoTex,.0092,.00195,.0365);
},undefined,()=>{
 const fallback=makeTextTexture('TWYNE',100,700,22);
 addFrontPlane(fallback,.0088,.00145,.0386);
 addBackPlane(fallback,.0088,.00145,.0365);
});

addFrontPlane(makeTextTexture('SOTTO VOCE',170,700),.0104,.00215,.0305);
addFrontPlane(makeTextTexture('EAU DE PARFUM',82,500,3),.0082,.00115,.0230);

// BACK — SAME HORIZONTAL READING DIRECTION WHEN VIEWED FROM BACK
addBackPlane(makeTextTexture('TWYNEHAUS.COM',84,500,2),.0093,.00115,.0285);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(.45,.45),new THREE.ShadowMaterial({color:0x000000,opacity:.11}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.0001;floor.receiveShadow=true;scene.add(floor);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>

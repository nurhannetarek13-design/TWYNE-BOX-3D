<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TWYNE — 2ml Sample V18</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e7e4dd;font-family:Arial,Helvetica,sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.ui{position:fixed;left:24px;top:22px;color:#111;pointer-events:none}.brand{font-size:12px;font-weight:700;letter-spacing:.22em}.sub{margin-top:8px;font-size:10px;letter-spacing:.16em;opacity:.55}.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:9px;letter-spacing:.16em;color:#111;opacity:.42;white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<div class="ui"><div class="brand">TWYNE</div><div class="sub">2ML SAMPLE</div></div>
<div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xe7e4dd);
const camera=new THREE.PerspectiveCamera(27,innerWidth/innerHeight,.01,100);camera.position.set(.038,.035,.185);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;document.getElementById('app').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.032,0);controls.minDistance=.105;controls.maxDistance=.34;controls.autoRotate=false;

scene.add(new THREE.HemisphereLight(0xffffff,0x746d64,2.25));
const key=new THREE.DirectionalLight(0xffffff,4.2);key.position.set(2,3,4);key.castShadow=true;scene.add(key);
const fill=new THREE.DirectionalLight(0xfff6eb,1.6);fill.position.set(-3,1,-2);scene.add(fill);

const sample=new THREE.Group();scene.add(sample);
const r=.0055,h=.048,y=.024;
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(r*.78,r*.78,h*.70,64),new THREE.MeshPhysicalMaterial({color:0xf0d5a6,transparent:true,opacity:.30,roughness:.08,transmission:.35,thickness:.004,ior:1.35}));liquid.position.y=y-h*.11;sample.add(liquid);
const glass=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.035,transmission:.96,transparent:true,opacity:.48,thickness:.0018,ior:1.5,clearcoat:1,clearcoatRoughness:.03});
const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,96),glass);body.position.y=y;body.castShadow=true;sample.add(body);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.0032,.00345,.0068,64),glass);neck.position.y=.0514;sample.add(neck);
const collar=new THREE.Mesh(new THREE.CylinderGeometry(.0041,.0041,.0032,64),new THREE.MeshStandardMaterial({color:0x111111,roughness:.42,metalness:.15}));collar.position.y=.0551;sample.add(collar);
const cap=new THREE.Mesh(new THREE.CylinderGeometry(.00455,.00455,.0115,64),new THREE.MeshStandardMaterial({color:0x0b0b0b,roughness:.6}));cap.position.y=.06245;sample.add(cap);

const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(r+.00010,r+.00010,.034,96,1,true),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.075,roughness:.18,transmission:.86,thickness:.0001,ior:1.43,depthWrite:false,side:THREE.DoubleSide}));sleeve.position.y=.028;sample.add(sleeve);

function textTexture(text,fontPx=120,weight=700){
 const c=document.createElement('canvas');c.width=1600;c.height=280;
 const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='#111';x.textAlign='center';x.textBaseline='middle';x.font=`${weight} ${fontPx}px Arial,Helvetica,sans-serif`;x.fillText(text,800,140);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
function artworkPlane(tex,w,hh,ypos){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,hh),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,side:THREE.DoubleSide,toneMapped:false}));
 m.position.set(0,ypos,0);m.rotation.z=-Math.PI/2;m.renderOrder=30;return m;
}
function makeFace(z,rotY){const g=new THREE.Group();g.position.z=z;g.rotation.y=rotY;sample.add(g);return g;}

const front=makeFace(r+.00045,0);
front.add(artworkPlane(textTexture('SOTTO VOCE',150,700),.0135,.00225,.0275));
front.add(artworkPlane(textTexture('EAU DE PARFUM',72,500),.0080,.00105,.0165));

const back=makeFace(-r-.00045,Math.PI);
back.add(artworkPlane(textTexture('TWYNEHAUS.COM',70,500),.0105,.00105,.0225));

const loader=new THREE.TextureLoader();
loader.load('./twyne-logo.png?v=18',(logoTex)=>{
 logoTex.colorSpace=THREE.SRGBColorSpace;logoTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
 const frontLogo=artworkPlane(logoTex,.0100,.00125,.0395);front.add(frontLogo);
 const backLogo=artworkPlane(logoTex,.0100,.00125,.0355);back.add(backLogo);
},undefined,(e)=>console.error('TWYNE logo texture failed',e));

const floor=new THREE.Mesh(new THREE.PlaneGeometry(.45,.45),new THREE.ShadowMaterial({color:0x000000,opacity:.12}));floor.rotation.x=-Math.PI/2;floor.position.y=-.0001;floor.receiveShadow=true;scene.add(floor);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>

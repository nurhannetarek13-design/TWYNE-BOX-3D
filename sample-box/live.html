<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWYNE — Sample Box</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d5cc;font-family:Arial,sans-serif;color:#171717}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}aside{position:fixed;right:22px;top:22px;width:280px;background:rgba(246,243,237,.95);padding:20px;border:1px solid rgba(0,0,0,.1)}.ey{font-size:10px;letter-spacing:.28em;margin-bottom:10px}h1{font-size:21px;font-weight:500;margin:0 0 5px}.sub,.lab{font-size:9px;letter-spacing:.12em;color:#777}.sub{margin-bottom:18px}.lab{margin:16px 0 8px}.slide{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:8px;color:#777}.slide input{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{border:1px solid #c6c1b8;background:#faf8f3;padding:9px;font-size:9px;letter-spacing:.08em;cursor:pointer}.btn.active{background:#1c1c1c;color:#f3efe6}.spec{font-size:9px;line-height:1.6;color:#57534d;border-top:1px solid #d1ccc3;padding-top:10px}@media(max-width:760px){aside{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:42vh}}</style></head><body><canvas id="c"></canvas><aside><div class="ey">TWYNE</div><h1>MATCHING SAMPLE</h1><div class="sub">HORIZONTAL CARTON — 2ML</div><div class="lab">OPEN / CLOSE</div><label class="slide"><span>Closed</span><input id="open" type="range" min="0" max="1" step=".01" value=".12"><span>Open</span></label><div class="lab">VIEW</div><div class="grid"><button class="btn active" id="q">3/4</button><button class="btn" id="f">Front</button><button class="btn" id="s">Side</button><button class="btn" id="t">Top</button></div><div class="lab">FRONT</div><div class="spec">TWYNE<br>SOTTO VOCE<br>EAU DE PARFUM<br><span style="color:#9a9690">2ML · 0.07 FL OZ</span></div></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const canvas=document.querySelector('#c'),r=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.08;const scene=new THREE.Scene();scene.background=new THREE.Color('#d9d5cc');const cam=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,600);cam.position.set(98,64,118);const ctl=new OrbitControls(cam,canvas);ctl.enableDamping=true;ctl.target.set(0,0,0);ctl.minDistance=70;ctl.maxDistance=230;scene.add(new THREE.HemisphereLight(0xfffbf3,0x5d5953,2.6));const key=new THREE.DirectionalLight(0xfff8ee,4.5);key.position.set(-70,100,90);key.castShadow=true;scene.add(key);const floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:'#d2cec5',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-24;scene.add(floor);const W=78,H=22,D=15,T=.65,CREAM='#E7E4DD',INK='#1b1b1b',LIGHT='#9a9690';const cream=new THREE.MeshStandardMaterial({color:CREAM,roughness:.95}),innerMat=new THREE.MeshStandardMaterial({color:'#d4d0c8',roughness:.98}),glass=new THREE.MeshPhysicalMaterial({color:'#2a211d',roughness:.16,transparent:true,opacity:.93}),spray=new THREE.MeshStandardMaterial({color:'#0d0d0d',roughness:.3,metalness:.18});const box=new THREE.Group();scene.add(box);function p(w,h,d,m,x,y,z,parent=box){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}p(W,H,T,cream,0,0,D/2);p(W,H,T,cream,0,0,-D/2);p(W,T,D-T,cream,0,H/2,0);p(W,T,D-T,cream,0,-H/2,0);p(T,H,D-T,cream,-W/2,0,0);const endPivot=new THREE.Group  L 717 176 L 680 290 L 642 176 L 584 176 L 544 290 L 507 176 Z"/><path d="M 91 176 L 91 214 L 162 214 L 162 333 L 211 333 L 211 214 L 283 214 L 283 176 Z"/></g></svg>';const logo=new Image();logo.onload=()=>{const targetW=520,targetH=130;x.drawImage(logo,(1800-targetW)/2,70,targetW,targetH);tx.needsUpdate=true};logo.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);let amt=.12;function upd(){endPivot.rotation.y=-amt*Math.PI*.58;vial.position.x=amt*20}upd();open.oninput=e=>{amt=+e.target.value;upd()};function view(pos,id){cam.position.set(...pos);ctl.target.set(0,0,0);ctl.update();document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));document.querySelector(id).classList.add('active')}q.onclick=()=>view([98,64,118],'#q');f.onclick=()=>view([0,0,145],'#f');s.onclick=()=>view([145,0,0],'#s');t.onclick=()=>view([0,145,48],'#t');addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});(function a(){requestAnimationFrame(a);ctl.update();r.render(scene,cam)})()</script></body></html>
